name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build portrait index
        run: node scripts/build-portrait-index.mjs
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html firebase-config.js cycle.js weapons.js assets.js _site/
          cp -r portraits icons _site/
      - name: Restore game image cache
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ hashFiles('assets.js', 'weapons.js') }}
          restore-keys: assets-
      - name: Fetch game images from encore.moe
        run: node scripts/fetch-assets.mjs _site/img .asset-cache
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
