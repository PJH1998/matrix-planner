name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portrait index
        run: node scripts/build-portrait-index.mjs
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html firebase-config.js updates.js _site/
          cp -r assets core data src portraits icons _site/
      - name: Restore processed image cache
        id: processed-images
        uses: actions/cache/restore@v4
        with:
          path: _site/img
          key: processed-images-${{ hashFiles('core/hub.js', 'data/chars/*.js', 'data/weapons.js', 'data/echoes.js', 'img-manual/**/*.webp', 'scripts/fetch-assets.mjs', 'scripts/process-card-images.py') }}
      - name: Restore game image cache
        if: steps.processed-images.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ hashFiles('core/hub.js', 'data/chars/*.js', 'data/weapons.js', 'data/echoes.js', 'scripts/fetch-assets.mjs') }}
      - name: Fetch game images from encore.moe
        if: steps.processed-images.outputs.cache-hit != 'true'
        id: fetch-images
        run: |
          node scripts/fetch-assets.mjs _site/img .asset-cache | tee image-fetch.log
          if grep -q '  실패:' image-fetch.log; then
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Smooth profile card images
        if: steps.processed-images.outputs.cache-hit != 'true'
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/process-card-images.py _site/img/card
      - name: Publish images to img-cache branch
        if: steps.processed-images.outputs.cache-hit != 'true' && steps.fetch-images.outputs.complete == 'true'
        run: |
          cd _site/img
          git init -q -b img-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "img cache ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" img-cache
          rm -rf .git
      - name: Save processed image cache
        if: steps.processed-images.outputs.cache-hit != 'true' && steps.fetch-images.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: _site/img
          key: processed-images-${{ hashFiles('core/hub.js', 'data/chars/*.js', 'data/weapons.js', 'data/echoes.js', 'img-manual/**/*.webp', 'scripts/fetch-assets.mjs', 'scripts/process-card-images.py') }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
