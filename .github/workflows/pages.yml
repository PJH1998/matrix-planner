name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portrait index
        run: node scripts/build-portrait-index.mjs
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html firebase-config.js updates.js _site/
          cp -r core data portraits icons _site/
      - name: Restore game image cache
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ hashFiles('data/chars/*.js', 'data/weapons.js') }}
          restore-keys: assets-
      - name: Fetch game images from encore.moe
        run: node scripts/fetch-assets.mjs _site/img .asset-cache
      - name: Smooth profile card images
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/process-card-images.py _site/img/card
      - name: Publish images to img-cache branch
        run: |
          cd _site/img
          git init -q -b img-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "img cache ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" img-cache
          rm -rf .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
